defaults:
  - logging: default
  - data: fineweb
  - model: 1B
  - optimizer: adam
  - _self_

model:
  type: diffusion
  diffusion_process: gidd
  p_uniform: 0.0
  t_eps: 1e-4

training:
  resume: null
  seed: 1
  global_train_batch_size: 16   # if null, it is calculated as train_batch_size*num_gpus
  train_batch_size: 8  # per-device micro-batch size
  eval_batch_size: 8
  num_train_steps: 2000
  lr_schedule: cosine
  warmup_steps: 10
  low_discrepancy_sampling: True
  dtype: bf16
  compile_model: True
  fsdp: True   # if False all the other parameters are not considered
  fsdp_sharding_strategy: SHARD_GRAD_OP
  fsdp_precision: mixed
  wrapping_strategy: null
  
loss:
  loss_type: gidd
  loss_weighting: dynamic  # [dynamic, clip, none]
  min_loss_weight: 0.0
  max_loss_weight: 2.0
  loss_scale: 1.0
  reduction: tokenmean

hydra:
  run:
    dir: ./outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}