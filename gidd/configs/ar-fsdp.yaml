defaults:
  - logging: default
  - data: fineweb
  - model: 1B
  - optimizer: adam
  - _self_

model:
  type: autoregressive

training:
  resume: null
  seed: 1
  train_batch_size: 8
  eval_batch_size: 8
  num_train_steps: 2000
  lr_schedule: cosine
  warmup_steps: 10
  dtype: bf16
  compile_model: False
  fsdp: True
  fsdp_sharding_strategy: SHARD_GRAD_OP
  fsdp_precision: mixed
  wrapping_strategy: null

loss:
  loss_type: ar
  loss_scale: 1.0
  reduction: tokenmean  # not used for AR loss

hydra:
  run:
    dir: ./outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}